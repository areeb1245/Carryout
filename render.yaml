# Render Blueprint: one web service with a persistent disk.
#
# Secrets are never in this file. Every `sync: false` key is asked for once, in the Render Dashboard, when the
# Blueprint is first applied; JWT_SECRET is generated by Render. See README, "Deploying on Render".
services:
  - type: web
    name: paypal-hackathon
    runtime: python
    region: virginia # next to the SAM endpoint on Modal (us-east)
    plan: starter # 512 MB; the server peaked at about 340 MB on the book clip. A paid plan is needed for the disk.
    numInstances: 1 # gate tickets, live visits and the sign-in throttle live in the process's memory
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn checkout.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz # touches nothing: /api/health would wake the GPU on every check
    disk:
      name: shop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # where the database, catalogues, clips and caches live: on the disk, not in the deploy
      - key: DATA_DIR
        value: /var/data
      # refuse to start without a staff code and a token secret
      - key: REQUIRE_STAFF
        value: "1"
      # this copy's own table in the face database, so it never touches the one used on the shop's computer
      - key: FACE_TABLE
        value: checkout_faces_render
      - key: PAYPAL_ENV
        value: sandbox
      # glibc gives every thread its own memory arena; with OpenCV, ONNX and the event loop's threads that alone can
      # cost a few hundred MB on 512. Two arenas are plenty for one process.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # staff sign-in
      - key: STAFF_CODE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # SAM 3.1 on Modal
      - key: SAM_URL
        sync: false
      - key: SAM_API_KEY
        sync: false
      # the vision language model (second looks, the check before charging)
      - key: LLM_URL
        sync: false
      - key: LLM_MODAL_KEY
        sync: false
      - key: LLM_MODAL_SECRET
        sync: false
      # PayPal sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # invoice email through Resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # face embeddings in Postgres with pgvector (Neon)
      - key: DATABASE_URL
        sync: false
