[project]
name = "sam3-supermarket"
version = "0.1.0"
description = "Cashierless checkout demo: SAM 3.1 masks, person tracking and pick attribution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "rapidocr-onnxruntime>=1.4.4",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# rapidocr asks for the desktop OpenCV, which shares the `cv2` folder with the headless one above and needs a
# desktop's graphics libraries (libxcb, libGL) a server does not have. This marker is never true: it is not installed.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
