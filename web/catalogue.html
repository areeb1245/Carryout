<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f9" />
    <link rel="icon" href="/static/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preload" href="https://cdn.fontshare.com/wf/HJHZ26OECMTXRH7JXPFC7EVIHDSLT2RA/LJRNLR7WCPF3PY3SZ7B2LHNUTQMFNCHL/4MCJYGQDIOOXHWSIIB2OYNDBEALJSOGN.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/styles.css" />
    <title>Catalogue</title>
  </head>
  <body class="staff">
    <header class="appbar">
      <a class="brand" href="/"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" /><path d="M6.5 10V6.5H10M14 6.5h3.5V10M17.5 14v3.5H14M10 17.5H6.5V14" /><rect class="core" x="10" y="10" width="4" height="4" rx="1" /></svg><span id="brand">Shop</span></a>
      <nav class="pages" aria-label="Screens">
        <a href="/" data-page="floor">Floor</a>
        <a href="/catalogue" data-page="catalogue">Catalogue</a>
        <a href="/dashboard" data-page="dashboard">Dashboard</a>
      </nav>
      <div class="appbar-end">
        <a class="button" href="/gate" target="_blank" rel="noopener">Open gate<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" /></svg></a>
        <button type="button" class="icon" id="open-settings" aria-label="Settings" title="Settings">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
        </button>
      </div>
    </header>
    <nav class="tabs" aria-label="Catalogue">
      <a href="#products" data-tab="products">Products</a>
      <a href="#footage" data-tab="footage">From footage</a>
    </nav>

    <main class="cat">
      <section id="products-view" class="products-view" aria-label="Products">
        <div class="cat-head">
          <div>
            <h1>Products</h1>
            <p class="hint" id="count"></p>
          </div>
          <div class="toolbar">
            <select id="shop" aria-label="Shop"></select>
            <input type="search" id="filter" placeholder="Search products" aria-label="Search products" autocomplete="off" />
            <button type="button" id="add-product"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>Add product</button>
            <button type="button" class="primary" id="save">Save</button>
          </div>
        </div>
        <p class="hint note" id="note" role="status"></p>

        <div class="cat-body">
          <div class="list-card">
            <div class="list" id="products" aria-label="Products"></div>
          </div>

          <div class="cat-side">
            <form class="editor" id="editor" novalidate aria-label="Product"></form>

            <section class="side-card">
              <div class="section-head"><h2>SAM 3 prompts</h2><span class="sub" id="prompt-n"></span></div>
              <div class="budget" aria-hidden="true"><span id="prompt-bar"></span></div>
              <p class="hint" id="prompt-count"></p>
            </section>

            <section class="side-card">
              <div class="section-head"><h2>Camera rules</h2></div>
              <div class="field">
                <label for="belongings">Never billed</label>
                <input id="belongings" type="text" autocomplete="off" placeholder="mobile phone, wallet" />
                <p class="hint">Shoppers' own things, comma separated</p>
              </div>
              <div class="field">
                <label for="leave-after">Exit after, seconds out of view</label>
                <input id="leave-after" type="number" min="1" max="30" step="0.5" inputmode="decimal" />
              </div>
            </section>
          </div>
        </div>
        <input type="file" id="picture-file" accept="image/*" hidden />
      </section>

      <section id="footage-view" class="footage" aria-label="From footage" hidden>
        <div class="reel">
          <div class="toolbar source-bar">
            <div class="seg" role="group" aria-label="Source">
              <button type="button" id="src-camera" aria-pressed="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11" /><rect x="2" y="6" width="14" height="12" rx="2" /></svg>Camera</button>
              <button type="button" id="src-video" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M7 3v18M17 3v18M3 7.5h4M3 12h18M3 16.5h4M17 7.5h4M17 16.5h4" /></svg>Video</button>
            </div>
            <div class="src-group" id="camera-tools">
              <select id="cam-pick" aria-label="Camera"></select>
              <button type="button" class="primary" id="hold">Record product</button>
            </div>
            <div class="src-group" id="video-tools" hidden>
              <select id="clip" aria-label="Footage"></select>
              <input type="file" id="clip-file" accept="video/*" hidden />
              <button type="button" id="look">Look again</button>
              <button type="button" id="scan">Look at every frame</button>
            </div>
            <input type="text" id="look-for" placeholder="Also look for, comma separated" aria-label="Also look for" autocomplete="off" />
          </div>
          <div class="frame" id="frame-box">
            <video id="cam" playsinline muted hidden></video>
            <canvas id="frame" width="960" height="540"></canvas>
            <p class="frame-note" id="frame-note">Choose footage, or import a video of the products</p>
            <span class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <p class="live-chip rec-chip" aria-hidden="true"><i></i>Recording</p>
          </div>
          <p class="capture" id="capture" role="status" hidden></p>
          <div class="scrub" id="scrub">
            <button type="button" class="icon" id="prev" aria-label="Previous frame">‹</button>
            <input type="range" id="scrubber" min="0" max="0" value="0" aria-label="Frame" />
            <button type="button" class="icon" id="next" aria-label="Next frame">›</button>
            <span class="hint num" id="frame-at"></span>
          </div>
          <div class="strip" id="strip" aria-hidden="true"></div>
          <p class="hint" id="reel-hint">Click an outline, or drag a box round anything it missed</p>
        </div>

        <aside class="pick" id="pick" aria-live="polite">
          <p class="empty">Nothing picked</p>
        </aside>
      </section>
    </main>

    <script src="/static/catalogue.js" type="module"></script>
  </body>
</html>
