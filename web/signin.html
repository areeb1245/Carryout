<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff sign-in</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f5c45'/%3E%3Cpath d='M4 5h8l-1 6H5z' fill='none' stroke='%23fff' stroke-width='1.4'/%3E%3C/svg%3E" />
    <link rel="preload" href="/static/fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="staff">
    <main class="signin">
      <form id="signin" class="signin-card" novalidate>
        <h1>Staff sign-in</h1>
        <p class="hint">The floor, the catalogue and the dashboard are for the shop's staff.</p>
        <div class="field">
          <label for="code">Staff code</label>
          <input id="code" name="code" type="password" autocomplete="current-password" required autofocus />
        </div>
        <p class="error" id="error" role="alert" hidden></p>
        <button type="submit" class="primary" id="go">Sign in</button>
        <a class="button quiet" href="/gate">Shopper? Go to the gate</a>
      </form>
    </main>
    <script src="/static/signin.js" type="module"></script>
  </body>
</html>
