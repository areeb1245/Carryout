<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f9" />
    <link rel="icon" href="/static/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preload" href="https://cdn.fontshare.com/wf/HJHZ26OECMTXRH7JXPFC7EVIHDSLT2RA/LJRNLR7WCPF3PY3SZ7B2LHNUTQMFNCHL/4MCJYGQDIOOXHWSIIB2OYNDBEALJSOGN.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/styles.css" />
    <title>Staff sign-in</title>
  </head>
  <body class="staff signin-page">
    <main class="signin">
      <form id="signin" class="signin-card" novalidate>
        <span class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" /><path d="M6.5 10V6.5H10M14 6.5h3.5V10M17.5 14v3.5H14M10 17.5H6.5V14" /><rect class="core" x="10" y="10" width="4" height="4" rx="1" /></svg><span>Staff</span></span>
        <div>
          <h1>Sign in</h1>
          <p class="hint">For shop staff</p>
        </div>
        <div class="field">
          <label for="code">Staff code</label>
          <input id="code" name="code" type="password" autocomplete="current-password" required autofocus />
        </div>
        <p class="error" id="error" role="alert" hidden></p>
        <button type="submit" class="primary" id="go">Sign in</button>
      </form>
      <a class="button quiet" href="/gate">Shopping? Go to the gate</a>
    </main>
    <script src="/static/signin.js" type="module"></script>
  </body>
</html>
