<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f5c45'/%3E%3Cpath d='M4 5h8l-1 6H5z' fill='none' stroke='%23fff' stroke-width='1.4'/%3E%3C/svg%3E" />
    <link rel="preload" href="/static/fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="staff">
    <header class="bar app">
      <span class="brand" id="brand">Shop</span>
      <nav class="pages" aria-label="Screens">
        <a href="/" data-page="floor">Floor</a>
        <a href="/catalogue" data-page="catalogue">Catalogue</a>
        <a href="/dashboard" data-page="dashboard">Dashboard</a>
      </nav>
      <p class="status" id="model" role="status"><span class="dot" id="model-dot"></span><span id="model-text">Starting cameras</span></p>
      <a class="button" href="/gate" target="_blank" rel="noopener">Open gate</a>
      <button type="button" class="icon" id="open-settings" aria-label="Settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>

    <main class="floor">
      <section class="stage" aria-label="Shop floor camera">
        <div class="viewer" id="viewer">
          <canvas id="view" width="960" height="540"></canvas>
          <p class="viewer-note" id="viewer-note"><strong>Shop floor</strong><span>Select a camera or video, then press Start.</span></p>
        </div>

        <div class="controls">
          <div class="field">
            <label for="shop">Shop</label>
            <select id="shop"></select>
          </div>
          <div class="field grow">
            <label for="source">Footage</label>
            <select id="source"></select>
          </div>
          <div class="field grow" id="camera-field" hidden>
            <label for="camera">Camera</label>
            <select id="camera"></select>
          </div>
          <input type="file" id="file" accept="video/*" hidden />
          <button class="primary" id="start" type="button">Start</button>
          <label class="check"><input type="checkbox" id="dry" /> Rehearsal: no charge, no email</label>
        </div>
        <p class="meter" id="meter" aria-live="off"></p>

        <div class="section-head">
          <h2>Activity</h2>
          <select id="who" aria-label="Show the activity of" hidden></select>
          <button type="button" class="quiet" id="more-events" hidden>Show all</button>
        </div>
        <ol class="events" id="events">
          <li class="empty">Nothing yet. What shoppers take, put back and pay for is listed here.</li>
        </ol>
      </section>

      <aside class="side" aria-label="Shoppers">
        <div class="section-head">
          <h2>In the shop</h2>
          <span class="sub" id="pay-note"></span>
        </div>
        <div id="carts"><p class="empty">No shoppers in store. Shoppers appear here after entering through the gate.</p></div>
      </aside>
    </main>


    <video id="video" playsinline muted hidden></video>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
